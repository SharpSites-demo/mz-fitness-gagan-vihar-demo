<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SharpSites hero review</title><style>body{margin:0;background:#edeae4;color:#262321;font:14px Arial}header{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:10px 16px;border:1px solid #bbb;border-radius:30px;background:white}main{overflow:auto;padding:10px}iframe{border:0;display:block;background:white;margin:auto}#results{white-space:pre-wrap;background:white;padding:20px}a{color:inherit}</style><header><strong>SharpSites · Human-scene hero review</strong><select id="site" aria-label="Business"></select><button data-width="390">Phone · 390</button><button data-width="768">Tablet · 768</button><button data-width="1440">Desktop · 1440</button><button id="run">Run regression checks</button><span id="status"></span></header><main><iframe title="Demo preview" width="1440" height="900"></iframe></main><pre id="results"></pre><script>
const sites=[{"row": 2, "name": "MZ Fitness", "url": "https://sharpsites-demo.github.io/mz-fitness-gagan-vihar-demo/"}, {"row": 3, "name": "Svadhayaya Brain & Soul Care", "url": "https://sharpsites-demo.github.io/svadhayaya-brain-soul-demo/"}, {"row": 4, "name": "Dr. Astha Agarwal", "url": "https://sharpsites-demo.github.io/dr-astha-agarwal-nina-demo/"}, {"row": 5, "name": "Remedial Physiotherapy Clinic", "url": "https://sharpsites-demo.github.io/remedial-physiotherapy-clinic-nina-demo/"}, {"row": 6, "name": "Dolce Vita Cosmetic Clinic", "url": "https://sharpsites-demo.github.io/dolce-vita-cosmetic-clinic-nina-demo/"}, {"row": 9, "name": "Dr. Kanchan\u2019s Dental Care", "url": "https://sharpsites-demo.github.io/dr-kanchans-dental-care-demo/"}, {"row": 12, "name": "Mangla ENT Clinic", "url": "https://sharpsites-demo.github.io/mangla-ent-demo/"}, {"row": 15, "name": "Dr Ruchika Sharma", "url": "https://sharpsites-demo.github.io/dr-ruchika-sharma-demo/"}, {"row": 18, "name": "Golden Grapes", "url": "https://sharpsites-demo.github.io/golden-grapes-club-and-convention-demo/"}, {"row": 32, "name": "Fitness Freak Gym", "url": "https://sharpsites-demo.github.io/fitness-freak-gym-govindpuri-demo/"}, {"row": 34, "name": "Armour Fitness Studio", "url": "https://sharpsites-demo.github.io/armour-fitness-studio-new-colony-demo/"}, {"row": 43, "name": "Golden Petals Banquet", "url": "https://sharpsites-demo.github.io/golden-petals-banquet-kadrabad-demo/"}];
const frame=document.querySelector('iframe'),select=document.querySelector('select'),status=document.querySelector('#status'),results=document.querySelector('#results');
sites.forEach(s=>select.add(new Option(s.name,s.row)));
function source(s){return new URLSearchParams(location.search).has('live')?s.url:'row-'+s.row+'.html'}
function load(s,width){frame.width=width;frame.height=width<700?844:900;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Page load timeout')),20000);frame.onload=()=>{clearTimeout(timer);resolve()};frame.src=source(s)})}
select.onchange=()=>load(sites.find(s=>s.row==select.value),frame.width);document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>load(sites.find(s=>s.row==select.value),b.dataset.width));
const delay=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const records=[];results.textContent='';for(const s of sites){for(const width of [390,768,1440]){status.textContent=s.row+' · '+s.name+' · '+width;try{await load(s,width);const d=frame.contentDocument,w=frame.contentWindow;await Promise.all([...d.images].map(i=>i.decode().catch(()=>{})));await delay(80);const hero=d.querySelector('.ss-v6-visual'),img=hero?.querySelector('img'),pause=hero?.querySelector('button'),overflow=d.documentElement.scrollWidth>w.innerWidth+1;const motionTarget=d.querySelector('.ss-v6-real .ss-v6-frame')||img;const initial=motionTarget&&w.getComputedStyle(motionTarget).transform;await delay(400);const moving=initial!==w.getComputedStyle(motionTarget).transform;pause?.click();await delay(50);const stopA=w.getComputedStyle(motionTarget).transform;await delay(150);const stopped=stopA===w.getComputedStyle(motionTarget).transform;pause?.click();const rounded=[...d.querySelectorAll('button,.button,.nav-call,.text-link')].every(el=>parseFloat(w.getComputedStyle(el).borderTopLeftRadius)>10);const localLinks=[...d.querySelectorAll('a[href^="#"]')].every(a=>a.hash==='#top'||d.getElementById(a.hash.slice(1)));const record={row:s.row,width,title:!!d.querySelector('h1')?.textContent,hero:!!hero,image:!!img?.naturalWidth,overflow,moving,stopped,rounded,localLinks,wa:d.querySelectorAll('a.wa').length===1,revision:!!d.querySelector('#ss-human-hero-v6'),reducedMotionCSS:[...d.querySelectorAll('style')].some(x=>x.id==='ss-human-hero-v6'&&x.textContent.includes('@media(prefers-reduced-motion:reduce)'))};record.pass=record.title&&record.hero&&record.image&&!overflow&&moving&&stopped&&rounded&&localLinks&&record.wa&&record.revision;records.push(record);results.textContent=JSON.stringify(records,null,2);}catch(e){records.push({row:s.row,width,pass:false,error:String(e)});results.textContent=JSON.stringify(records,null,2)}}}status.textContent='Complete: '+records.filter(x=>x.pass).length+'/'+records.length+' passed';document.querySelector('#run').disabled=false;};load(sites[0],1440);
</script></html>
